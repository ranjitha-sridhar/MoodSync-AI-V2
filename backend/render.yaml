services:
  - type: web
    name: moodsync-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: moodsync-db
          property: connectionString
      - key: MODEL_PATH
        value: ml/notebooks/emotion_model.keras
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: '["https://mood-sync-ai-v2-ranjitha-s.vercel.app","https://mood-sync-ai-v2-git-feature-moodsync-upgrade-ranjitha-s.vercel.app","https://mood-sync-ai-v2-bvp1za8jq-ranjitha-s.vercel.app","https://moodsync-ai.vercel.app","https://mood-sync-ai-v2-aoofar6ji-ranjitha-s.vercel.app"]'
databases:
  - name: moodsync-db
    plan: free
